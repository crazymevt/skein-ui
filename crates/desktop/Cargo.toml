[package]
name = "skein-ui-desktop"
description = "The skein-ui desktop backend: winit windows, wgpu surfaces, input (macOS first)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
skein-ui-engine.workspace = true
skein-ui-render.workspace = true
winit = "0.30"
wgpu = "30"
arboard = "3"
# (without libxdo: muda needs it only for its predefined Cut, Copy, Paste
# and Select All items on Linux, which skein-ui doesn't use, and with it
# the Linux renderer won't start on a desktop without libxdo.so.3)
muda = { version = "0.17", default-features = false, features = ["gtk"] }
rfd = "0.15"
