name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # (no window opens: the renderer runs its headless backend)
  SKEIN_UI_HEADLESS: "1"

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            experimental: false
          # The renderer hasn't been built or run on Linux yet: this job
          # shows what that takes, and doesn't fail the run until it passes.
          - name: Linux x86-64
            os: ubuntu-24.04
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          path: skein-ui

      - uses: actions/checkout@v5
        with:
          repository: crazymevt/skein-lang
          path: skein-lang

      - name: Linux packages
        if: runner.os == 'Linux'
        # GTK and xdo for the menus (muda), a software Vulkan driver for
        # the headless screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libxdo-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            skein-ui
            skein-lang

      - name: Build skein
        working-directory: skein-lang
        run: cargo build --release --locked -p skein

      - name: Build the renderer
        working-directory: skein-ui
        run: cargo build --release --locked -p skein-ui-host

      - name: Renderer tests
        working-directory: skein-ui
        run: cargo test --release --locked --workspace

      - name: skein.ui tests
        working-directory: skein-ui
        run: ../skein-lang/target/release/skein test --serial tests

  # Windows on ARM, built as skein-lang's own Windows job builds Skein: with
  # clang on the PATH and MMTk patched for Windows (tools/windows/mmtk.sh in
  # skein-lang). Like that job, it can't fail the run until it has been
  # green a while.
  windows:
    name: Windows arm64
    runs-on: windows-11-arm
    continue-on-error: true
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # (the skein-lang it's built with: Windows support is in main)
      SKEIN_LANG_REF: main
      # (MMTk with its Windows layer, in place of the one on crates.io)
      MMTK: --config=patch.crates-io.mmtk.path='target/mmtk-windows'
    steps:
      - name: Files as they are in the repository
        # (Git on Windows would give every text file \r\n line ends, the
        # MMTk patch and its script among them)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          path: skein-ui

      - uses: actions/checkout@v5
        with:
          repository: crazymevt/skein-lang
          ref: ${{ env.SKEIN_LANG_REF }}
          path: skein-lang

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            skein-ui
            skein-lang

      - name: clang on the PATH
        # (Skein's dependencies build C with clang on Windows arm64; where
        # LLVM is installed, it isn't on the PATH)
        run: |
          if [ -x "/c/Program Files/LLVM/bin/clang.exe" ]; then
            echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
          fi
          clang --version || echo "::warning::No clang on the PATH"

      - name: MMTk with its Windows layer
        working-directory: skein-lang
        run: tools/windows/mmtk.sh

      - name: Build skein
        # (not --locked: Cargo.lock names the MMTk on crates.io)
        working-directory: skein-lang
        run: cargo "$MMTK" build --release -p skein

      - name: Build the renderer
        working-directory: skein-ui
        run: cargo build --release --locked -p skein-ui-host

      - name: Renderer tests
        working-directory: skein-ui
        run: cargo test --release --locked --workspace

      - name: skein.ui tests
        working-directory: skein-ui
        run: ../skein-lang/target/release/skein.exe test --serial tests
