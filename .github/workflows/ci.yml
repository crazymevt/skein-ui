name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # (no window opens: the renderer runs its headless backend)
  SKEIN_UI_HEADLESS: "1"

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            experimental: false
          # The renderer hasn't been built or run on Linux yet: this job
          # shows what that takes, and doesn't fail the run until it passes.
          - name: Linux x86-64
            os: ubuntu-24.04
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          path: skein-ui

      # (Skein as released; change the version here for a new one)
      - uses: crazymevt/skein-lang@v0.1.0

      - name: Linux packages
        if: runner.os == 'Linux'
        # GTK and xdo for the menus (muda), a software Vulkan driver for
        # the headless screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libxdo-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skein-ui

      - name: Build the renderer
        working-directory: skein-ui
        run: cargo build --release --locked -p skein-ui-host

      - name: The renderer's shared libraries (Linux)
        if: runner.os == 'Linux'
        working-directory: skein-ui
        # What a desktop needs installed for the renderer to start. libxdo
        # isn't on most desktops, and without it the renderer can't start.
        run: |
          readelf -d target/release/skein-ui-host | grep NEEDED
          if readelf -d target/release/skein-ui-host | grep -q libxdo; then
            echo "::error::The renderer needs libxdo again (muda's libxdo feature?)"
            exit 1
          fi

      - name: Renderer tests
        working-directory: skein-ui
        run: cargo test --release --locked --workspace

      - name: skein.ui tests
        working-directory: skein-ui
        run: skein test --serial tests

  # Windows on ARM and on x86-64, with clang on the PATH as skein-lang's own
  # Windows jobs have it. Like those jobs, they can't fail the run until
  # they've been green a while.
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: windows-11-arm }
          - { arch: x86-64, runner: windows-latest }
    continue-on-error: true
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Files as they are in the repository
        # (Git on Windows would give every text file \r\n line ends)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          path: skein-ui

      # (Skein as released; change the version here for a new one)
      - uses: crazymevt/skein-lang@v0.1.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skein-ui

      - name: clang on the PATH
        # (the renderer's dependencies build C with clang on Windows arm64,
        # and cc takes it on x86-64 too where it's there; where LLVM is
        # installed, it isn't on the PATH)
        run: |
          if [ -x "/c/Program Files/LLVM/bin/clang.exe" ]; then
            echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
          fi
          clang --version || echo "::warning::No clang on the PATH"

      - name: Build the renderer
        working-directory: skein-ui
        run: cargo build --release --locked -p skein-ui-host

      - name: Renderer tests
        working-directory: skein-ui
        run: cargo test --release --locked --workspace

      - name: skein.ui tests
        # (even after the renderer's tests fail: they're the other half)
        if: ${{ !cancelled() }}
        working-directory: skein-ui
        run: skein test --serial tests
